name: touch_grass
description: Touch Grass data layer - SQLite on the phone, MongoDB Atlas backup, street routing and offline map packs.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  path: ^1.9.1
  sqflite: ^2.4.4+1
  http: ^1.6.0
  # data track (lib/datatrack): uuid ids for the Overpass quest builder
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  assets:
    # Bundled Central Park map pack (places + walking streets), used offline
    - assets/fallback/
